# Flume 1.11 agent: follow new JSONL records and append them to HDFS.
# The timestamp interceptor supplies the fields used by the HDFS path pattern.
nexo.sources = app_tail
nexo.channels = memory
nexo.sinks = hdfs_logs

nexo.sources.app_tail.type = exec
nexo.sources.app_tail.command = tail -F -n 0 /opt/nexo/data/app.log
nexo.sources.app_tail.shell = /bin/bash -c
nexo.sources.app_tail.channels = memory
nexo.sources.app_tail.interceptors = timestamp
nexo.sources.app_tail.interceptors.timestamp.type = timestamp
nexo.sources.app_tail.interceptors.timestamp.preserveExisting = false

nexo.channels.memory.type = memory
nexo.channels.memory.capacity = 10000
nexo.channels.memory.transactionCapacity = 1000

nexo.sinks.hdfs_logs.type = hdfs
nexo.sinks.hdfs_logs.channel = memory
nexo.sinks.hdfs_logs.hdfs.path = hdfs://namenode:9000/nexo/bronze/logs/%Y/%m/%d
nexo.sinks.hdfs_logs.hdfs.filePrefix = app
nexo.sinks.hdfs_logs.hdfs.fileSuffix = .jsonl
nexo.sinks.hdfs_logs.hdfs.fileType = DataStream
nexo.sinks.hdfs_logs.hdfs.writeFormat = Text
nexo.sinks.hdfs_logs.hdfs.useLocalTimeStamp = false
nexo.sinks.hdfs_logs.hdfs.rollInterval = 30
nexo.sinks.hdfs_logs.hdfs.rollSize = 0
nexo.sinks.hdfs_logs.hdfs.rollCount = 0
nexo.sinks.hdfs_logs.hdfs.batchSize = 100
