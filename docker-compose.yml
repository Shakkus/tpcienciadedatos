# Entorno local NexoUrbano — recortar servicios si la RAM es justa.
# Mínimo viable en 8 GB RAM: mysql + mongo + cassandra (uno a la vez) + neo4j.
# Hadoop local de un solo nodo; iniciar solo estos servicios para no levantar el resto.
#
#   docker compose up -d mysql mongo
#   docker compose up -d neo4j
#   docker compose up -d hadoop-namenode hadoop-datanode hadoop-resourcemanager hadoop-nodemanager
#
# Los puertos son los de factory. Cambiar si chocan con algo local.
# Las imágenes de Docker Hub salen de public.ecr.aws: auth.docker.io responde 500 o timeout.

services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4
    container_name: nexo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nexo
      MYSQL_DATABASE: crm
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql/crm_riders.sql:/docker-entrypoint-initdb.d/01_crm.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pnexo"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: public.ecr.aws/docker/library/mongo:8
    container_name: nexo-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: public.ecr.aws/docker/library/cassandra:5
    container_name: nexo-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra

  neo4j:
    image: public.ecr.aws/docker/library/neo4j:5-community
    container_name: nexo-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/nexo-urban-2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  minio:
    # minio/minio salió de Docker Hub (sep 2026) y quay.io ya no permite pull anónimo.
    # Chainguard publica el mismo binario: comando, MINIO_ROOT_* y consola en :9001.
    image: cgr.dev/chainguard/minio:latest
    container_name: nexo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexo
      MINIO_ROOT_PASSWORD: nexo-urban-2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  hadoop-namenode:
    image: apache/hadoop:3.4.1
    container_name: nexo-hadoop-namenode
    hostname: namenode
    profiles: ["hadoop"]
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/dfs/name
      HADOOP_HEAPSIZE_MAX: 512
    ports:
      - "9870:9870"
    volumes:
      - ./data:/opt/nexo/data:ro
      - ./04-hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./04-hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./04-hadoop/config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./04-hadoop/config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - hadoop_namenode:/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  pig:
    image: nexo/pig:0.18.0-hadoop3.4.1
    build:
      context: ./04-hadoop/pig
      dockerfile: Dockerfile
    profiles: ["pig"]
    volumes:
      - ./data:/opt/nexo/data:ro
      - ./04-hadoop/pig:/opt/nexo/04-hadoop/pig:ro
      - ./.staging/pig:/output
    working_dir: /opt/nexo

  hadoop-datanode:
    image: apache/hadoop:3.4.1
    container_name: nexo-hadoop-datanode
    hostname: datanode
    profiles: ["hadoop"]
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    volumes:
      - ./04-hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./04-hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./04-hadoop/config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./04-hadoop/config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - hadoop_datanode:/data

  hadoop-resourcemanager:
    image: apache/hadoop:3.4.1
    container_name: nexo-hadoop-resourcemanager
    hostname: resourcemanager
    profiles: ["hadoop"]
    command: ["yarn", "resourcemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512
    ports:
      - "8088:8088"
    volumes:
      - ./04-hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./04-hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./04-hadoop/config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./04-hadoop/config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro

  hadoop-nodemanager:
    image: apache/hadoop:3.4.1
    container_name: nexo-hadoop-nodemanager
    hostname: nodemanager
    profiles: ["hadoop"]
    command: ["yarn", "nodemanager"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512
      WAITFOR: resourcemanager:8032
    depends_on:
      hadoop-resourcemanager:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    volumes:
      - ./04-hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./04-hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./04-hadoop/config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./04-hadoop/config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro

volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
  minio_data:
  hadoop_namenode:
  hadoop_datanode:
